name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Generated code is up to date
        run: |
          go tool sqlc generate
          git diff --exit-code
      - name: Test
        run: go test -race ./...
      - name: go fix
        run: test -z "$(go fix -diff ./...)"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  miniapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/miniapp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/miniapp/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
